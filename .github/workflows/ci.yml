name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        # The current social-login package declares an Angular peer range newer than this Angular 19 app.
        # Keep CI running while that dependency compatibility is reviewed; do not change app dependencies silently.
        run: npm ci --legacy-peer-deps
      - name: Build Angular application
        run: npm run build
