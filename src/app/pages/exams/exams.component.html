<app-header></app-header>

<div class="exams-container">
  <!-- Hero Section -->
  <div class="hero-section" [@fadeInUp]>
    <h1 class="main-title" *ngIf="!selectedExam">Top India <br><span class="exam-text">Exams</span></h1>
    <h1 class="main-title" *ngIf="selectedExam">{{getSelectedExam()?.name}} <br><span class="exam-text">Exams</span></h1>
    <p class="subtitle">Choose the plan that helps you study smarter, save time, and crack any exam<br>with AI-powered learning tools</p>
  </div>

  <!-- Exams Grid -->
  <div class="exams-grid">
    <div 
      *ngFor="let exam of exams" 
      class="exam-card"
      [ngClass]="{'selected': selectedExam === exam.id}"
      [ngStyle]="{
        'background': selectedExam === exam.id 
          ? 'linear-gradient(90deg, #BD94F4 0%, #9F7DCD 100%)' 
          : '#F0F0F0'
      }"
      (click)="selectExam(exam.id)"
      [@fadeInUp]>
      
      <!-- Collapsed State: Show basic info -->
      <div *ngIf="selectedExam !== exam.id" class="collapsed-content">
        <div class="card-header">
          <h3 class="exam-title">{{ exam.name }}</h3>
        </div>
        <p class="exam-full-name">{{ exam.fullName }}</p>
        <p class="exam-description">{{ exam.description }}</p>
        <a class="details-link">Details ></a>
      </div>

      <!-- Expanded State: Show form -->
      <div *ngIf="selectedExam === exam.id" class="expanded-content">
        <div class="form-header">
          <h2 class="form-title">
            {{ exam.name }}
            <span class="form-subtitle">{{ exam.fullName }}</span>
          </h2>
        </div>

        <div class="form-content">
          <div class="form-row">
            <div class="form-group">
              <label>SUBJECT</label>
              <div class="select-wrapper">
                <select [(ngModel)]="selectedSubject" class="form-select" (click)="$event.stopPropagation()">
                  <option value="" disabled selected></option>
                  <option *ngFor="let subject of getSelectedExam()?.subjects" [value]="subject.value">
                    {{ subject.label }}
                  </option>
                </select>
                <svg class="select-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:black"/>
                </svg>
              </div>
            </div>

            <div class="form-group">
              <label>LEVEL</label>
              <div class="select-wrapper">
                <select [(ngModel)]="selectedLevel" class="form-select" (click)="$event.stopPropagation()">
                  <option value="" disabled selected></option>
                  <option *ngFor="let level of getSelectedExam()?.levels" [value]="level.value">
                    {{ level.label }}
                  </option>
                </select>
                <svg class="select-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:black"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>LANGUAGE</label>
              <div class="select-wrapper">
                <select [(ngModel)]="selectedLanguage" class="form-select" (click)="$event.stopPropagation()">
                  <option value="" disabled selected></option>
                  <option *ngFor="let language of getSelectedExam()?.languages" [value]="language.value">
                    {{ language.label }}
                  </option>
                </select>
                <svg class="select-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:black"/>
                </svg>
              </div>
            </div>

            <div class="form-group">
              <label>MODE</label>
              <div class="select-wrapper">
                <select [(ngModel)]="selectedMode" class="form-select" (click)="$event.stopPropagation()">
                  <option value="" disabled selected></option>
                  <option *ngFor="let mode of getSelectedExam()?.modes" [value]="mode.value">
                    {{ mode.label }}
                  </option>
                </select>
                <svg class="select-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:black"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="button-container">
            <button 
              class="enter-button" 
              [disabled]="!canSubmit()"
              (click)="handleSubmit()">
              ENTER
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
